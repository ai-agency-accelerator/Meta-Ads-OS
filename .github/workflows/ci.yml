# Comprobaciones de cada cambio en el producto: tests sin red, validación del producto (cifras, cabeceras, enlaces,
# CLAUDE.md y fugas) e instalador en Mac, Linux y Windows (Git Bash). No usa secretos ni llama a Meta, GHL o Stripe.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests y validación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOTOR_MOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: FFmpeg (lo usan los tests de vídeo)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Tests
        run: uv run pytest -q

      - name: Validación del producto
        run: uv run python scripts/validar.py

  instalador:
    name: Instalador (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Primera instalación
        run: bash scripts/instalar.sh

      - name: Segunda instalación (idempotente, no pisa nada)
        run: |
          echo "# marca de la prueba" >> contexto/operador.md
          bash scripts/instalar.sh
          grep -q "marca de la prueba" contexto/operador.md

      - name: Instancia creada
        run: |
          for f in contexto/operador.md contexto/preferencias.md contexto/instalacion.json .env; do
            test -f "$f" || { echo "Falta $f"; exit 1; }
          done
          for d in clientes aprendizajes logs informes/diario; do
            test -d "$d" || { echo "Falta $d/"; exit 1; }
          done

      - name: Estado de la instalación
        run: |
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" -I scripts/instalacion.py ver
          "$PY" -I scripts/instalacion.py ver --json | grep -q '"tecnica": "hecho"'

      - name: Nada de la instancia queda para versionar
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || { git status --short; exit 1; }
