[project]
name = "cutkit"
version = "1.0.0"
description = "Editor de vídeo de Meta Ads OS: anuncios 9:16 y 4:5 con hook, subtítulos, marca del cliente y zonas seguras; montaje avanzado por decisiones ancladas a palabras."
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.8",
  "pyyaml>=6",
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "pillow>=10",
  "opencv-python-headless>=4.10,<5",       # 5.x retira el clasificador Haar (detección de caras)
  "httpx>=0.27",
]

[project.optional-dependencies]
# Montaje avanzado (`ck new … ck run`): geometría del render, eventos visuales y capturas web con Chromium.
avanzado = ["playwright>=1.45", "jsonschema>=4.20"]
# Servicios de pago con tus claves (se cargan del .env de la raíz): transcripción whisper-1 (OpenAI),
# música con Lyria y juez multimodal (Gemini).
ia = ["openai>=1.60", "google-genai>=1.0"]
# Solo Mac: caras, OCR y recorte del sujeto con Apple Vision (en Linux y Windows se usa OpenCV y Tesseract).
mac = [
  "ocrmac>=1.0; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.scripts]
ck = "cutkit.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cutkit"]

