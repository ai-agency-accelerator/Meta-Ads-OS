                        lock: [click_ui, acento], layers: [tic_suave, textura], dock: [encaje, entrada, "lu=-17", "ms=-70"]}
  logo.reveal:         {logo: [pop_suave, entrada], mark: [trazo, acento, "ms=-60", "lu=-15"]}
  logo.row:            {logo: [pop_suave, entrada, escalera, "ms=50"], enter: [tic_suave, textura, "lu=-20"], connect: [circuito, entrada, escalera],
                        merge: [juntar, acento], off: [clic_apagado, textura, escalera, "lu=-21"]}
  demo.snippet:        {enter: [click_ui, entrada], highlight: [resaltado, entrada], check: [visto, acento, escalera],
                        field: [tecla, textura, escalera]}
  flow.pipeline:       {enter: [aire_corto, entrada], logo: [pop_suave, entrada], card_drop: [pop_suave, entrada, escalera],
                        lock: [click_pliega, entrada], flip: [giro, entrada, sustituye],
                        clip: [brillo, entrada], trim: [click_pliega, entrada],
                        link: [trazo_suave, entrada, escalera, "lu=-18"], pulse: [pulso, textura, escalera, "lu=-19"],
                        agent: [pop_suave, entrada]}
  flow.pipeline@tiles: {merge: [juntar, acento], lock: [aviso, acento]}
