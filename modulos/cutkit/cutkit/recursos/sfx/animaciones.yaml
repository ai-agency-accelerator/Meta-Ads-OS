  media.ui_focus:      {media.enter: [tic_suave, textura, "lu=-20"], media.focus: [aire_corto, textura, "lu=-20"],
                        media.ring: [trazo, entrada, "ms=0", "prop=ring"]}
  keyword.highlight:   {mark: [trazo, acento], replace: [pop_suave, entrada]}
  scene.capture3d:     {enter: [aire_corto, entrada]}
  stat.big_number:     {enter: [pop_suave, entrada], number: [acento, acento]}
  title.behind_subject: {enter: [aire_corto, entrada], title.land: [acento, acento]}
  title.lockup_grid:   {word: [click_ui, entrada, escalera, opcional]}
  cta.comment:         {type: [tecla, textura, escalera, protegido], like: [pop_suave, entrada, "lu=-16", protegido]}
  viz.decision:        {enter: [aire_corto, entrada], option: [click_ui, textura, escalera], flip: [click_ui, entrada]}
  viz.token_stream:    {enter: [aire_corto, entrada], token: [tecla, textura], choose: [acento, acento]}
  timeline.steps:      {enter: [aire_corto, entrada], step: [pop_suave, entrada, escalera], mark: [trazo, acento]}
  card.lesson:         {enter: [aire_corto, entrada], stamp: [sello, acento], play: [click_ui, entrada], badge: [sello, acento]}
  caption.lockup:      {lockup.enter: [pop_suave, entrada, "lu=-22"], lockup.hero: [trazo, acento]}
  viz.decision@inbox:  {stamp: [sello, acento, sustituye], choose: [sello, acento, sustituye]}
  viz.decision@route:  {arrow: [trazo, entrada], light: [encendido, acento, sustituye], choose: [encendido, acento, sustituye]}
  viz.decision@meter:  {tick: [click_ui, entrada, escalera], option: [click_ui, entrada, escalera],
                        land: [clavar, acento, sustituye], choose: [clavar, acento, sustituye]}
  viz.puzzle:          {enter: [aire_corto, entrada], slide: [aire_corto, entrada], snap: [click_pliega, acento], shine: [brillo, entrada]}
  viz.layers_control:  {enter: [aire_corto, entrada], build: [tic_capa, entrada, escalera, sustituye, "lu=-18"], toggle: [click_ui, entrada],
                        seal: [sello_ding, acento, "lu=-12"]}
  viz.offer_grid:      {enter: [aire_corto, entrada], tile: [pop_suave, textura, escalera, "ms=70"], focus: [foco_oferta, acento],
                        name: [aire_corto, textura], pick: [clavar, acento], carry: [brillo, textura],
                        "carry+0.2": [aire_corto, textura], spread: [aire_corto, entrada], connect: [circuito, entrada, escalera],
                        merge: [juntar, acento], note: [resaltado, entrada]}
  label.mode_tag:      {enter: [click_ui, textura, escalera]}
  viz.many_to_one:     {enter: [pop_suave, textura], dim: [aire_corto, textura], pick: [encendido, acento]}
  viz.shapes@dial:     {dial: [reloj_barrido, entrada], dial_end: [encendido, acento]}
  viz.shapes:          {enter: [aire_corto, entrada], morph: [pop_suave, entrada, escalera], note: [resaltado, entrada],
                        opps: [aire_corto, textura], node: [pop_suave, entrada], spread: [aire_corto, textura],
                        client: [encendido, acento], lap: [click_ui, textura], station: [click_ui, entrada, escalera],
                        best: [encendido, acento]}
  viz.projects:        {enter: [aire_corto, entrada], row: [click_ui, entrada], note: [resaltado, entrada],
                        copy: [aire_corto, entrada], vary: [encendido, acento], item: [click_ui, textura, escalera],
                        base: [resaltado, entrada], stamp: [sello, acento], best: [encendido, acento],
                        toggle: [click_ui, textura]}
  viz.projects@grow:   {card: [pop_suave, entrada], grow: [brillo, entrada]}
  viz.crm:             {enter: [aire_corto, entrada], row: [pop_suave, textura, escalera], dim: [aire_corto, textura],
                        light: [encendido, acento, escalera]}
  viz.road:            {enter: [aire_corto, entrada], node: [pop_suave, textura, escalera, "lu=-24", "ms=70"], highlight: [resaltado, entrada]}
  viz.gauges:          {enter: [aire_corto, entrada], fill: [aire_corto, entrada], limit: [click_ui, textura]}
  viz.capture_cam:     {enter: [tic_suave, textura, "lu=-20"], sheet: [aire_corto, textura], mark: [trazo, acento, "ms=-60", "lu=-15"], box: [resaltado, acento], row: [pop_suave, entrada], lit: [click_ui, entrada, escalera, "lu=-20"]}
  viz.sessions:        {pop: [pop_suave, entrada], arrange: [aire_corto, textura], hop: [click_ui, textura, escalera], marker: [pop_suave, textura],
                        fly: [juntar, acento], logo: [encendido, acento], swing: [aviso, acento], wire: [circuito, entrada], pulse: [pulso, textura, escalera],
                        dim: [aire_corto, textura], mark: [trazo, acento, "ms=-60", "lu=-15"]}
  viz.session_tree:    {head: [pop_suave, entrada], row: [pop_suave, textura, escalera], dim: [aire_corto, textura], flag: [encendido, acento],
                        born: [pop_suave, entrada], tree: [aire_corto, entrada], agent: [pop_suave, textura], light: [encendido, acento],
                        fly: [aire_corto, entrada], branch: [trazo, textura], pin: [clavar, entrada], glow: [brillo, textura]}
  viz.search_tasks:    {enter: [aire_corto, entrada], burst: [aviso, acento], found: [resaltado, acento], tick: [click_ui, textura],
                        swap: [aire_corto, entrada], mark: [trazo, acento]}
  viz.step:            {enter: [aire_corto, entrada]}
  viz.layer:           {enter: [aire_corto, entrada], land: [pop_suave, textura], warn: [clavar, entrada], node: [click_ui, textura]}
  viz.scope:           {enter: [aire_corto, entrada], grow: [pop_suave, textura, escalera], warn: [clavar, entrada], mark: [trazo, acento]}
  viz.duel_board:      {enter: [aire_corto, entrada], land: [pop_suave, entrada], row: [click_ui, textura],
                        value: [pop_suave, entrada], highlight: [resaltado, entrada], node: [click_ui, textura],
                        stop: [clavar, entrada], pick: [encendido, acento]}
