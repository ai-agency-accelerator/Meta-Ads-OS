# Tabla de precios usada por el libro de costes (USD).
# Fuente: páginas oficiales de precios de cada proveedor, consultadas entre el 2026-10-01 y el 2026-10-04.
# Los precios cambian: compáralos con la página del proveedor antes de un lote grande y actualiza esta tabla (el
# guardián de presupuesto estima con ella; el libro de costes registra las unidades reales que devuelve el proveedor).

