[project]
name = "motor"
version = "0.2.0"
description = "Motor de anuncios en vídeo con IA de Meta Ads OS: actores persistentes, router de modelos, timeline no destructiva, QA multimodal y variantes baratas."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.8",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13",
  "pillow>=10",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  "google-genai>=1.0",
  "fal-client>=0.5",
  "jinja2>=3",
]

[project.optional-dependencies]
# QA local completo: transcripción (faster-whisper), boca en planos mudos (MediaPipe), objeto en la mano (CLIP ONNX)
# y captura de apps web (Playwright). `uv run --project modulos/motor-ia --extra local motor setup`
local = ["faster-whisper>=1.0", "mediapipe>=0.10", "playwright>=1.45", "onnxruntime>=1.17", "tokenizers>=0.15"]
# pytest está en los dos sitios a propósito: `uv run --project modulos/motor-ia python -m pytest …` (grupo, entra por
# defecto) y `uv run --project modulos/motor-ia --extra dev pytest …` (extra) funcionan igual.
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
motor = "motor.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motor*"]

[tool.setuptools.package-data]
motor = ["config/*.yaml", "ui/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: prueba de extremo a extremo en simulado (varios minutos; coste 0)"]
